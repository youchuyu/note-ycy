<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Markdown Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
      body {
        max-width: 800px;
        margin: 40px auto;
        font-family: Arial, sans-serif;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <h1 id="title">Loading...</h1>
    <div id="content">Please wait...</div>
    <a href="/static/note/css/css.md">css</a>

    <script>
      const params = new URLSearchParams(window.location.search);
      const path = params.get("path");

      if (path) {
        document.getElementById("title").textContent = path;

        fetch(`/note/${path}`)
          .then((res) => {
            if (!res.ok) throw new Error("File not found");
            return res.text();
          })
          .then((markdown) => {
            document.getElementById("content").innerHTML =
              marked.parse(markdown);
          })
          .catch((err) => {
            document.getElementById("content").textContent = err.message;
          });
      } else {
        document.getElementById("content").textContent = "No path specified.";
      }
    </script>
  </body>
</html>
