<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <user-card
      name="Ada Lovelace"
      avatar="https://i.pravatar.cc/100?u=ada"
      desc="First computer programmer."
    ></user-card>
  </body>
  <script>
    class UserCard extends HTMLElement {
      constructor() {
        super();
        // 1. 创建 shadow DOM，使用 "open" 模式
        this.attachShadow({ mode: "open" });
      }

      // 2. 组件插入 DOM 后调用
      connectedCallback() {
        const name = this.getAttribute("name") || "Anonymous";
        const avatar = this.getAttribute("avatar") || "";
        const desc = this.getAttribute("desc") || "";

        // 3. 设置组件内部 HTML（已封装进 shadow DOM）
        this.shadowRoot.innerHTML = `
        <style>
          .card {
            font-family: sans-serif;
            border: 1px solid #ccc;
            padding: 16px;
            border-radius: 12px;
            max-width: 280px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            text-align: center;
          }
          img {
            border-radius: 50%;
            width: 80px;
            height: 80px;
            object-fit: cover;
          }
          h2 {
            margin: 12px 0 4px;
            font-size: 1.2rem;
          }
          p {
            color: #555;
            font-size: 0.95rem;
          }
        </style>
        <div class="card">
          <img src="${avatar}" alt="${name}">
          <h2>${name}</h2>
          <p>${desc}</p>
        </div>
      `;
      }
    }

    // 4. 注册组件
    customElements.define("user-card", UserCard);
  </script>
</html>
