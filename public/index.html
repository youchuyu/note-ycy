<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Markdown Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.2.0/github-markdown.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/normalize.css@8.0.1/normalize.css"
    />
    <style>
      html {
        --text-primary: #0d0d0d;
        --text-tertiary: #8f8f8f;
      }
      body {
      }

      #app {
        height: 100vh;
        width: 100vw;
        display: flex;
        gap: 12px;
        flex-direction: row;
      }

      #menu {
        overflow-y: auto;
      }

      .menu-text {
        margin-bottom: 4px;
      }

      #menu div {
        cursor: pointer;
      }

      #content {
        padding: 24px;
        flex: 1;
        overflow-y: auto;
      }

      .dir {
        color: var(--text-tertiary);
        font-weight: 400;
        padding: 4px 12px;
        background-color: rgba(139, 139, 139, 0.1);
        margin-bottom: 8px;
      }
      .note {
        color: var(--text-primary);
        font-weight: 400;
        padding-left: 12px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="menu"></div>
      <div id="content" class="markdown-body"></div>
    </div>
    <script>
      const buildMenu = (data, parentNode) => {
        const el = document.createElement("div");
        const text = document.createElement("div");
        text.classList.add("menu-text");

        text.innerHTML = data.name;
        el.appendChild(text);
        if (data.isDir) {
          el.classList.add("dir");

          const sorted = [...data?.children]
            .filter((v) => v.name.endsWith(".md") || v.isDir)
            .sort((a, b) => {
              if (!a.isDir && b.isDir) {
                return -1;
              } else {
                return 0;
              }
            });

          sorted?.forEach((element) => {
            buildMenu(element, el);
          });

          console.log("sorted===>", sorted);
        } else {
          console.log("data===>", data);
          el.addEventListener("click", async () => {
            const res = await fetch("/" + data.path);
            const fileData = await res.text();

            console.log("fileData==>", fileData);

            document.getElementById("content").innerHTML =
              marked.parse(fileData);
          });

          el.classList.add("note");
        }
        parentNode.appendChild(el);
      };

      const init = async () => {
        const res = await fetch("/files");
        const fileData = await res.json();

        console.log(fileData.files);

        const menuContainer = document.getElementById("menu");

        buildMenu(fileData.files, menuContainer);
      };

      init();
    </script>
  </body>
</html>
